services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ../api
      target: build
    env_file: ../api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    command: ["pnpm", "db:migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build: ../api
    env_file: ../api/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
