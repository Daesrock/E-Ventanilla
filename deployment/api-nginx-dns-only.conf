# Advanced del host exclusivo api-ventanilla.daesrock.dev cuando Cloudflare
# publica solamente DNS. Nginx termina TLS y recibe directamente al cliente.
# Evitar heredar los rangos privados/CDN de NPM para sustituir la IP desde
# cabeceras aportadas por conexiones TCP. Este host no escucha sockets Unix.
# https://nginx.org/en/docs/http/ngx_http_realip_module.html
set_real_ip_from unix:;
real_ip_header X-Real-IP;
real_ip_recursive off;
