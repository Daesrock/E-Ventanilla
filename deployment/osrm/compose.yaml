name: eventanilla-routing
services:
  osrm:
    image: ${OSRM_RUNTIME_IMAGE:?Prepara primero la imagen y el grafo}
    command: [--algorithm, mld, --threads, "1", --max-table-size, "51", --verbosity, WARNING, /data/region.osrm]
    volumes:
      - ${OSRM_DATA_DIR:?Selecciona el grafo verificado}:/data:ro
    networks:
      routing_net:
        aliases: [eventanilla_osrm]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, /bin/sh, /opt/project-healthcheck.sh]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

networks:
  routing_net: {external: true, name: eventanilla_routing}
